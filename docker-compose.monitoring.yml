name: spire-codex-monitoring

# Host-level metrics for the DO box. node_exporter must run on host
# networking (to see eth0 / lo / docker0 interfaces of the host
# itself, not its own container namespace) and with /proc, /sys, /
# bind-mounted read-only so it can read kernel stats from outside its
# cgroup.
#
# Scraped via nginx through https://spire-codex.com/node-metrics —
# allowed only to the metrics_monitor_ip in nginx.conf.j2, so the
# endpoint is invisible to anyone but the scraper. The nginx container
# reaches node_exporter via host.docker.internal (host-gateway), which
# requires `--add-host=host.docker.internal:host-gateway` on the
# web-server container (handled by monitoring-install.yml).

services:
  node-exporter:
    # Pinned: an unattended :latest pull can silently break metrics shipping.
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      # Skip pseudo-filesystems that just add cardinality without value.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+|var/lib/containers/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Ships logs to the homelab Loki and container metrics to the homelab
  # Prometheus (remote write), both behind Cloudflare Access with a service
  # token. Serving box: shared config plus the nginx file pipeline (nginx
  # writes its logs to /data/nginx/nginx/logs on the host). The ingest box
  # runs docker-compose.monitoring-ingest.yml instead.
  #
  # Needs an .env next to this compose (NOT committed, see
  # .env.monitoring.example).
  alloy:
    # Pinned: an unattended :latest pull can silently break log shipping.
    image: grafana/alloy:v1.20.0
    container_name: alloy
    restart: unless-stopped
    privileged: true
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/conf.d
    volumes:
      - /data/nginx/nginx/logs:/var/log/nginx:ro
      - /var/log:/var/log/host:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - ./alloy/config.alloy:/etc/alloy/conf.d/config.alloy:ro
      - ./alloy/nginx.alloy:/etc/alloy/conf.d/nginx.alloy:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      LOKI_URL: "${LOKI_URL}"
      CF_ACCESS_CLIENT_ID: "${CF_ACCESS_CLIENT_ID}"
      CF_ACCESS_CLIENT_SECRET: "${CF_ACCESS_CLIENT_SECRET}"
      PROM_REMOTE_WRITE_URL: "${PROM_REMOTE_WRITE_URL}"
      HOST_LABEL: "${HOST_LABEL:-spire-codex}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy-data:
