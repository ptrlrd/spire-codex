---
- name: Render litestream.yml from OpenBao and push to primary
  hosts: prod_origins
  gather_facts: false
  vars:
    remote_config: /etc/litestream.yml
  tasks:
    - name: Refuse to touch secondary unless allow_secondary=yes
      assert:
        that:
          - inventory_hostname == 'primary' or (allow_secondary | default('no')) == 'yes'
        fail_msg: "Refusing to sync Litestream config to {{ inventory_hostname }}; re-run with -e allow_secondary=yes"
    - name: Render and push litestream.yml
      become: true
      template:
        src: ../files/litestream.yml.j2
        dest: "{{ remote_config }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: restart litestream
  handlers:
    - name: restart litestream
      become: true
      systemd:
        name: litestream
        state: restarted
        daemon_reload: false
