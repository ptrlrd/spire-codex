---
- name: Install hourly auto-deploy cron + CF purge env
  hosts: prod_origins
  gather_facts: false
  vars:
    autodeploy_script: /usr/local/bin/spire-codex-autodeploy
    cron_file: /etc/cron.d/spire-codex-autodeploy
    cf_env_dir: /etc/spire-codex
    cf_env_file: /etc/spire-codex/cf-purge.env
  tasks:
    - name: Read Cloudflare credentials from OpenBao
      set_fact:
        cf: "{{ lookup('community.hashi_vault.vault_kv2_get', 'spire-codex-cloudflare', url=bao_url, engine_mount_point=bao_mount).secret }}"
      no_log: true
    - name: Copy autodeploy script
      become: true
      copy:
        src: ../files/autodeploy.sh
        dest: "{{ autodeploy_script }}"
        mode: "0755"
        owner: root
        group: root
    - name: Install cron entry
      become: true
      copy:
        src: ../files/spire-codex-autodeploy.cron
        dest: "{{ cron_file }}"
        mode: "0644"
        owner: root
        group: root
    - name: Ensure CF env dir exists
      become: true
      file:
        path: "{{ cf_env_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root
    - name: Render CF purge env
      become: true
      copy:
        content: |
          CF_TOKEN="{{ cf.api_token }}"
          CF_ZONE="{{ cf.zone_id }}"
        dest: "{{ cf_env_file }}"
        mode: "0600"
        owner: root
        group: root
      no_log: true
    - name: Confirm cron installed
      become: true
      command: ls -la "{{ cron_file }}" "{{ autodeploy_script }}"
      register: install_check
      changed_when: false
    - name: Summary
      debug:
        msg: |
          Auto-deploy installed. Fires :03 every hour.
          Manual trigger: sudo /usr/local/bin/spire-codex-autodeploy
          Logs: /var/log/spire-codex-autodeploy.log
