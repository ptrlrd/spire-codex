---
- name: Install deploy script + CF purge env, remove the auto-deploy cron
  hosts: prod_origins
  gather_facts: false
  vars:
    autodeploy_script: /usr/local/bin/spire-codex-autodeploy
    cron_file: /etc/cron.d/spire-codex-autodeploy
    cf_env_dir: /etc/spire-codex
    cf_env_file: /etc/spire-codex/cf-purge.env
  tasks:
    - name: Read Cloudflare credentials from OpenBao
      set_fact:
        cf: "{{ lookup('community.hashi_vault.vault_kv2_get', 'spire-codex-cloudflare', url=bao_url, engine_mount_point=bao_mount).secret }}"
      no_log: true
    - name: Copy autodeploy script
      become: true
      copy:
        src: ../files/autodeploy.sh
        dest: "{{ autodeploy_script }}"
        mode: "0755"
        owner: root
        group: root

    - name: Remove the hourly auto-deploy cron (deploys are manual, see startup.sh)
      become: true
      file:
        path: "{{ cron_file }}"
        state: absent

    - name: Ensure CF env dir exists
      become: true
      file:
        path: "{{ cf_env_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root
    - name: Render CF purge env
      become: true
      copy:
        content: |
          CF_TOKEN="{{ cf.api_token }}"
          CF_ZONE="{{ cf.zone_id }}"
        dest: "{{ cf_env_file }}"
        mode: "0600"
        owner: root
        group: root
      no_log: true
    - name: Confirm the deploy script is in place
      become: true
      command: ls -la "{{ autodeploy_script }}"
      register: install_check
      changed_when: false
    - name: Summary
      debug:
        msg: |
          Deploy script installed; deploys are manual (./tools/startup.sh release).
          Manual trigger: sudo /usr/local/bin/spire-codex-autodeploy
          Logs: /var/log/spire-codex-autodeploy.log
