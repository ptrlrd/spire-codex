---
- name: Purge Cloudflare cache
  hosts: localhost
  gather_facts: false
  vars:
    everything: false
    urls: []
  tasks:
    - name: Read Cloudflare credentials from OpenBao
      set_fact:
        cf: "{{ lookup('community.hashi_vault.vault_kv2_get', 'spire-codex-cloudflare', url=bao_url, engine_mount_point=bao_mount).secret }}"
      no_log: true
    - name: Purge everything
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cf.zone_id }}/purge_cache"
        method: POST
        headers:
          Authorization: "Bearer {{ cf.api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          purge_everything: true
        status_code: 200
      when: everything | bool
      register: purge_all
      no_log: true
    - name: Purge specific URLs
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cf.zone_id }}/purge_cache"
        method: POST
        headers:
          Authorization: "Bearer {{ cf.api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          files: "{{ urls }}"
        status_code: 200
      when: not (everything | bool) and urls | length > 0
      register: purge_urls
      no_log: true
    - name: Report
      debug:
        msg: >
          {% if everything | bool %}
          Purged entire spire-codex.com zone
          {% elif urls | length > 0 %}
          Purged {{ urls | length }} URL(s): {{ urls | join(', ') }}
          {% else %}
          Nothing purged; pass -e everything=true or -e 'urls=["..."]'
          {% endif %}
