---
- name: Render .env from OpenBao and push to prod origins
  hosts: prod_origins
  gather_facts: false
  tasks:
    - name: Render and push .env
      become: true
      template:
        src: ../files/.env.j2
        dest: "{{ remote_env_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      no_log: true
      notify: recreate backend
  handlers:
    - name: recreate backend
      become: true
      command: docker compose -f {{ compose_file }} up -d --force-recreate {{ backend_service }}
      args:
        chdir: "{{ spire_codex_dir }}"
