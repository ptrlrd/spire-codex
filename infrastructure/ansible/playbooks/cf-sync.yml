---
- name: Verify Cloudflare configuration against inventory
  hosts: localhost
  gather_facts: false
  vars:
    cf_api: https://api.cloudflare.com/client/v4
  tasks:
    - name: Read Cloudflare credentials from OpenBao
      set_fact:
        cf: "{{ lookup('community.hashi_vault.vault_kv2_get', 'spire-codex-cloudflare', url=bao_url, engine_mount_point=bao_mount).secret }}"
      no_log: true
    - name: List cache rules
      uri:
        url: "{{ cf_api }}/zones/{{ cf.zone_id }}/rulesets/phases/http_request_cache_settings/entrypoint"
        headers:
          Authorization: "Bearer {{ cf.api_token }}"
        return_content: true
      register: cache_rules
      changed_when: false
      no_log: true
    - name: Confirm QA bypass rule exists
      assert:
        that:
          - cache_rules.json.result.rules | selectattr('description', 'search', 'QA') | list | length > 0
        fail_msg: "Cache rule for /qa/ bypass not found in Cloudflare"
        success_msg: QA bypass cache rule present
    - name: Confirm /metrics bypass rule exists
      assert:
        that:
          - cache_rules.json.result.rules | selectattr('description', 'search', 'metrics|Prometheus') | list | length > 0
        fail_msg: "Cache rule for /metrics bypass not found in Cloudflare"
        success_msg: /metrics bypass cache rule present
    - name: List DNS records for the zone
      uri:
        url: "{{ cf_api }}/zones/{{ cf.zone_id }}/dns_records?name=spire-codex.com"
        headers:
          Authorization: "Bearer {{ cf.api_token }}"
        return_content: true
      register: dns
      changed_when: false
      no_log: true
    - name: Show apex DNS record(s)
      debug:
        msg: "{{ dns.json.result | map(attribute='content') | list }}"
